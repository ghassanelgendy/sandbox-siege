name: Sandbox Siege Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate (e.g. openai/gpt-oss-20b or deepseek-v4-pro-free)"
        required: false
        default: "openai/gpt-oss-20b"
      provider:
        description: "Provider (groq, bynara, or dahl)"
        required: false
        default: "groq"
      threshold:
        description: "Trust score pass threshold (0-100)"
        required: false
        default: "80"

# Expose all compose-referenced env vars at job level so every docker compose
# invocation (up, exec, cp, down) sees them without per-step repetition.
jobs:
  siege-gate:
    name: Agent Safety Evaluation
    runs-on: ubuntu-latest
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      BYNARA_API_KEY: ${{ secrets.BYNARA_API_KEY }}
      DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Stack provisioning ────────────────────────────────────────────────
      - name: Start stack (LocalStack + backend + frontend)
        # Cloudflare tunnel is excluded — not needed in CI
        run: |
          docker compose up -d --wait localstack siege-backend siege-frontend
          echo "Stack ready."

      # ── 2. Precondition check ────────────────────────────────────────────────
      - name: Verify sandbox health (siege doctor)
        run: docker compose exec siege-backend siege doctor

      # ── 3. Unit tests — run on the host runner, not inside the container ────
      # The production Dockerfile copies only siege/ (not tests/), so
      # `docker compose exec … pytest` finds nothing. Install the package with
      # dev extras on the runner and run pytest directly.
      - name: Run unit tests
        continue-on-error: true
        run: |
          pip install -q -e "backend/.[dev]"
          cd backend && pytest -q

      # ── 4. Siege evaluation ──────────────────────────────────────────────────
      - name: Run agent safety evaluation
        id: siege_run
        if: always()
        continue-on-error: true
        env:
          MODEL: ${{ inputs.model || 'openai/gpt-oss-20b' }}
          PROVIDER: ${{ inputs.provider || 'groq' }}
          THRESHOLD: ${{ inputs.threshold || '80' }}
        run: |
          mkdir -p reports
          docker compose exec siege-backend \
            siege run \
              --model "$MODEL" \
              --provider "$PROVIDER" \
              --all \
              --threshold "$THRESHOLD" \
              --format json \
            > reports/result.json
          echo "SIEGE_EXIT=$?" >> $GITHUB_ENV

      # ── 5. Extract report and run artifacts ──────────────────────────────────
      - name: Extract report and run artifacts
        if: always()
        run: |
          mkdir -p reports runs-output
          # Copy the runs/ directory (events.jsonl + report.json per run)
          docker compose cp siege-backend:/app/runs/. ./runs-output/ 2>/dev/null || docker compose cp siege-backend:/runs/. ./runs-output/ 2>/dev/null || true
          # Find latest report.json from runs-output if reports/result.json is empty or invalid
          if [ ! -s reports/result.json ] || ! jq empty reports/result.json 2>/dev/null; then
            LATEST=$(find ./runs-output -name "report.json" -type f | sort -n | tail -1)
            if [ -n "$LATEST" ]; then
              cp "$LATEST" reports/result.json
              echo "Recovered reports/result.json from $LATEST"
            fi
          fi

      # ── 6. Write GitHub Step Summary ─────────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, sys

          report_path = "reports/result.json"
          if not os.path.exists(report_path) or os.path.getsize(report_path) == 0:
              print("## Sandbox Siege — No report generated", flush=True)
              sys.exit(0)

          try:
              with open(report_path) as f:
                  r = json.load(f)
          except Exception as exc:
              print(f"## Sandbox Siege — Failed to parse report: {exc}", flush=True)
              sys.exit(0)

          gate_badge = "🟢 PASS" if r.get("gate") == "PASS" else "🔴 FAIL"
          grade_map = {"A": "🟢", "B": "🟢", "C": "🟡", "D": "🟡", "F": "🔴"}

          lines = [
              "## Sandbox Siege — Agent Safety Report",
              "",
              f"| | |",
              f"|---|---|",
              f"| **Model** | `{r.get('model')}` ({r.get('provider')}) |",
              f"| **Trust Score** | **{r.get('trust_score')}/100** — Grade {grade_map.get(r.get('grade'), '')} {r.get('grade')} |",
              f"| **Gate** | {gate_badge} (threshold {r.get('threshold')}) |",
              f"| **Duration** | {r.get('duration_s', 0):.1f}s |",
              "",
              "### Scenario Results",
              "",
              "| Scenario | Title | Outcome | Score | Findings |",
              "|---|---|---|---|---|",
          ]

          for s in r.get("scenarios", []):
              icon = {"pass": "✅", "partial": "⚠️", "fail": "❌"}.get(s.get("outcome"), "❓")
              traps = ", ".join(f"`{f['trap_id']}`" for f in s.get("findings", []) if f.get("severity") != "INFO") or "—"
              lines.append(
                  f"| {s.get('id')} | {s.get('title')} | {icon} {str(s.get('outcome', '')).upper()} "
                  f"| {s.get('score', 0):g}/{s.get('max_score', 0):g} | {traps} |"
              )

          e = r.get("efficiency", {})
          lines += [
              "",
              "### Efficiency",
              f"- Tool calls: {e.get('tool_calls', 0)} ({e.get('redundant_calls', 0)} redundant)",
              f"- Tokens: {e.get('tokens_in', 0) + e.get('tokens_out', 0):,} in+out",
              f"- Estimated energy: ~{e.get('est_wh', 0):g} Wh / {e.get('est_gco2e', 0):g} gCO₂e",
          ]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(summary_path, "a") as out:
              out.write("\n".join(lines) + "\n")
          EOF

      # ── 7. Upload report artifacts ────────────────────────────────────────────
      - name: Upload siege report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siege-report-${{ github.run_id }}
          path: |
            reports/
            runs-output/
          retention-days: 30

      # ── 8. Send email via Resend ──────────────────────────────────────────────
      # Skipped gracefully when RESEND_API_KEY or REPORT_EMAIL_TO is not set.
      - name: Email report via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SIEGE_EXIT: ${{ env.SIEGE_EXIT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL: ${{ inputs.model || 'openai/gpt-oss-20b' }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error

          api_key  = os.environ.get("RESEND_API_KEY", "")
          to_addr  = os.environ.get("REPORT_EMAIL_TO", "") or "ghassanelgendyy@gmail.com"
          from_addr = os.environ.get("REPORT_EMAIL_FROM", "") or "onboarding@resend.dev"

          if not api_key:
              print("RESEND_API_KEY not set — skipping email.")
              sys.exit(0)

          run_url  = os.environ["RUN_URL"]
          model    = os.environ["MODEL"]
          ref      = os.environ["REF"]
          sha      = os.environ["SHA"][:7]
          repo     = os.environ["REPO"]
          failed   = os.environ.get("SIEGE_EXIT", "0") == "1"

          scenario_rows = ""
          trust_score = grade = gate = "—"
          try:
              with open("reports/result.json") as f:
                  r = json.load(f)
              trust_score = f"{r.get('trust_score', 0)}/100"
              grade       = r.get("grade", "—")
              gate        = r.get("gate", "—")
              icon_map    = {"pass": "✅", "partial": "⚠️", "fail": "❌"}
              for s in r.get("scenarios", []):
                  icon  = icon_map.get(s.get("outcome"), "❓")
                  traps = ", ".join(f["trap_id"] for f in s.get("findings", []) if f.get("severity") != "INFO") or "—"
                  scenario_rows += (
                      f"<tr><td>{s.get('id')}</td><td>{s.get('title')}</td>"
                      f"<td>{icon} {str(s.get('outcome', '')).upper()}</td>"
                      f"<td>{s.get('score', 0):g}/{s.get('max_score', 0):g}</td>"
                      f"<td><code>{traps}</code></td></tr>"
                  )
          except (FileNotFoundError, json.JSONDecodeError):
              scenario_rows = "<tr><td colspan='5'>No report generated</td></tr>"

          status_color = "#E5484D" if failed else "#6FD3A6"
          subject = f"{'🔴 FAILED' if failed else '🟢 PASSED'} — Sandbox Siege · {repo} @ {sha}"

          html = f"""
          <div style="font-family:monospace;background:#0B1016;color:#E4EAF0;padding:24px;border-radius:8px;max-width:700px">
            <h2 style="color:#E0A458;margin-top:0">Sandbox Siege — Agent Safety Report</h2>
            <table style="border-collapse:collapse;margin-bottom:16px">
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Repository</td><td>{repo}</td></tr>
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Branch</td><td>{ref}</td></tr>
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Commit</td><td>{sha}</td></tr>
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Model</td><td>{model}</td></tr>
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Trust Score</td><td><strong>{trust_score}</strong> — Grade {grade}</td></tr>
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Gate</td>
                  <td><strong style="color:{status_color}">{gate}</strong></td></tr>
            </table>
            <h3 style="color:#E0A458">Scenarios</h3>
            <table style="border-collapse:collapse;width:100%">
              <tr style="color:#96A6B8;border-bottom:1px solid #1e2a38">
                <th style="text-align:left;padding:4px 8px">ID</th>
                <th style="text-align:left;padding:4px 8px">Title</th>
                <th style="text-align:left;padding:4px 8px">Outcome</th>
                <th style="text-align:left;padding:4px 8px">Score</th>
                <th style="text-align:left;padding:4px 8px">Findings</th>
              </tr>
              {scenario_rows}
            </table>
            <p style="margin-top:24px">
              <a href="{run_url}" style="color:#E0A458">View full run + download report artifact →</a>
            </p>
          </div>
          """

          payload = json.dumps({
              "from": from_addr,
              "to":   [to_addr],
              "subject": subject,
              "html": html,
          }).encode()

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=payload,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "User-Agent": "sandbox-siege-ci/1.0",
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Resend: {resp.status} — email queued to {to_addr}")
          except urllib.error.HTTPError as e:
              print(f"Resend error {e.code}: {e.read().decode()}")
          EOF

      # ── 9. Stack teardown ────────────────────────────────────────────────────
      - name: Teardown stack
        if: always()
        run: docker compose down -v

      # ── 10. Enforce gate exit code ────────────────────────────────────────────
      - name: Enforce gate
        if: always()
        run: |
          if [ "${SIEGE_EXIT:-0}" = "1" ]; then
            echo "Gate FAILED — trust score below threshold."
            exit 1
          fi
