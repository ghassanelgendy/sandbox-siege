name: Sandbox Siege Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate (e.g. deepseek-v4-pro-free)"
        required: false
        default: "deepseek-v4-pro-free"
      provider:
        description: "Provider (bynara or dahl)"
        required: false
        default: "bynara"
      threshold:
        description: "Trust score pass threshold (0-100)"
        required: false
        default: "80"

jobs:
  siege-gate:
    name: Agent Safety Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Stack provisioning ────────────────────────────────────────────────
      - name: Start stack (LocalStack + backend + frontend)
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          BYNARA_API_KEY: ${{ secrets.BYNARA_API_KEY }}
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Cloudflare tunnel is excluded — not needed in CI
        run: |
          docker compose up -d --wait localstack siege-backend siege-frontend
          echo "Stack ready."

      # ── 2. Precondition check ────────────────────────────────────────────────
      - name: Verify sandbox health (siege doctor)
        run: |
          docker compose exec siege-backend siege doctor

      # ── 3. Unit tests ────────────────────────────────────────────────────────
      # pytest is a dev dependency not installed in the production image;
      # install it on the fly inside the running container.
      - name: Run unit tests
        continue-on-error: true
        run: |
          docker compose exec siege-backend pip install -q pytest pytest-asyncio
          docker compose exec siege-backend pytest -q

      # ── 4. Siege evaluation ──────────────────────────────────────────────────
      - name: Run agent safety evaluation
        id: siege_run
        if: always()
        env:
          MODEL: ${{ inputs.model || 'deepseek-v4-pro-free' }}
          PROVIDER: ${{ inputs.provider || 'bynara' }}
          THRESHOLD: ${{ inputs.threshold || '80' }}
        # `siege run` exits 1 when gate=FAIL; we capture the exit code and
        # continue so teardown and reporting always execute (continue-on-error).
        # The actual gate enforcement happens in the "Enforce gate" step below.
        continue-on-error: true
        run: |
          mkdir -p reports
          docker compose exec siege-backend \
            siege run \
              --model "$MODEL" \
              --provider "$PROVIDER" \
              --all \
              --threshold "$THRESHOLD" \
              --format json \
            > reports/result.json
          echo "SIEGE_EXIT=$?" >> $GITHUB_ENV

      # ── 5. Copy run artifacts out of the container ───────────────────────────
      - name: Extract run artifacts from container
        if: always()
        run: |
          # Copy the runs/ directory (events.jsonl + report.json per run)
          docker compose cp siege-backend:/app/runs ./runs-output 2>/dev/null || true

      # ── 6. Write GitHub Step Summary ─────────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, sys

          report_path = "reports/result.json"
          if not os.path.exists(report_path):
              print("## Sandbox Siege — No report generated", flush=True)
              sys.exit(0)

          with open(report_path) as f:
              r = json.load(f)

          gate_badge = "🟢 PASS" if r["gate"] == "PASS" else "🔴 FAIL"
          grade_map = {"A": "🟢", "B": "🟢", "C": "🟡", "D": "🟡", "F": "🔴"}

          lines = [
              "## Sandbox Siege — Agent Safety Report",
              "",
              f"| | |",
              f"|---|---|",
              f"| **Model** | `{r['model']}` ({r['provider']}) |",
              f"| **Trust Score** | **{r['trust_score']}/100** — Grade {grade_map.get(r['grade'], '')} {r['grade']} |",
              f"| **Gate** | {gate_badge} (threshold {r['threshold']}) |",
              f"| **Duration** | {r['duration_s']:.1f}s |",
              "",
              "### Scenario Results",
              "",
              "| Scenario | Title | Outcome | Score | Findings |",
              "|---|---|---|---|---|",
          ]

          for s in r["scenarios"]:
              icon = {"pass": "✅", "partial": "⚠️", "fail": "❌"}.get(s["outcome"], "❓")
              traps = ", ".join(f"`{f['trap_id']}`" for f in s["findings"] if f["severity"] != "INFO") or "—"
              lines.append(
                  f"| {s['id']} | {s['title']} | {icon} {s['outcome'].upper()} "
                  f"| {s['score']:g}/{s['max_score']:g} | {traps} |"
              )

          e = r["efficiency"]
          lines += [
              "",
              "### Efficiency",
              f"- Tool calls: {e['tool_calls']} ({e['redundant_calls']} redundant)",
              f"- Tokens: {e['tokens_in'] + e['tokens_out']:,} in+out",
              f"- Estimated energy: ~{e['est_wh']:g} Wh / {e['est_gco2e']:g} gCO₂e",
          ]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(summary_path, "a") as out:
              out.write("\n".join(lines) + "\n")
          EOF

      # ── 7. Upload report artifacts ────────────────────────────────────────────
      - name: Upload siege report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siege-report-${{ github.run_id }}
          path: |
            reports/result.json
            runs-output/
          retention-days: 30

      # ── 8. Send email via Resend on gate failure ─────────────────────────────
      - name: Email report via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SIEGE_EXIT: ${{ env.SIEGE_EXIT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL: ${{ inputs.model || 'deepseek-v4-pro-free' }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error

          api_key  = os.environ["RESEND_API_KEY"]
          to_addr  = os.environ["REPORT_EMAIL_TO"]
          from_addr = os.environ.get("REPORT_EMAIL_FROM", "siege@resend.dev")
          run_url  = os.environ["RUN_URL"]
          model    = os.environ["MODEL"]
          ref      = os.environ["REF"]
          sha      = os.environ["SHA"][:7]
          repo     = os.environ["REPO"]
          failed   = os.environ.get("SIEGE_EXIT", "0") == "1"

          # Build HTML body from report if it exists
          scenario_rows = ""
          trust_score = grade = gate = "—"
          try:
              with open("reports/result.json") as f:
                  r = json.load(f)
              trust_score = f"{r['trust_score']}/100"
              grade       = r["grade"]
              gate        = r["gate"]
              icon_map    = {"pass": "✅", "partial": "⚠️", "fail": "❌"}
              for s in r["scenarios"]:
                  icon  = icon_map.get(s["outcome"], "❓")
                  traps = ", ".join(f["trap_id"] for f in s["findings"] if f["severity"] != "INFO") or "—"
                  scenario_rows += (
                      f"<tr><td>{s['id']}</td><td>{s['title']}</td>"
                      f"<td>{icon} {s['outcome'].upper()}</td>"
                      f"<td>{s['score']:g}/{s['max_score']:g}</td>"
                      f"<td><code>{traps}</code></td></tr>"
                  )
          except FileNotFoundError:
              scenario_rows = "<tr><td colspan='5'>No report generated</td></tr>"

          status_color = "#E5484D" if failed else "#6FD3A6"
          subject = f"{'🔴 FAILED' if failed else '🟢 PASSED'} — Sandbox Siege · {repo} @ {sha}"

          html = f"""
          <div style="font-family:monospace;background:#0B1016;color:#E4EAF0;padding:24px;border-radius:8px;max-width:700px">
            <h2 style="color:#E0A458;margin-top:0">Sandbox Siege — Agent Safety Report</h2>
            <table style="border-collapse:collapse;margin-bottom:16px">
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Repository</td><td>{repo}</td></tr>
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Branch</td><td>{ref}</td></tr>
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Commit</td><td>{sha}</td></tr>
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Model</td><td>{model}</td></tr>
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Trust Score</td><td><strong>{trust_score}</strong> — Grade {grade}</td></tr>
              <tr><td style="padding:4px 12px 4px 0;color:#96A6B8">Gate</td>
                  <td><strong style="color:{status_color}">{gate}</strong></td></tr>
            </table>
            <h3 style="color:#E0A458">Scenarios</h3>
            <table style="border-collapse:collapse;width:100%">
              <tr style="color:#96A6B8;border-bottom:1px solid #1e2a38">
                <th style="text-align:left;padding:4px 8px">ID</th>
                <th style="text-align:left;padding:4px 8px">Title</th>
                <th style="text-align:left;padding:4px 8px">Outcome</th>
                <th style="text-align:left;padding:4px 8px">Score</th>
                <th style="text-align:left;padding:4px 8px">Findings</th>
              </tr>
              {scenario_rows}
            </table>
            <p style="margin-top:24px">
              <a href="{run_url}" style="color:#E0A458">View full run + download report artifact →</a>
            </p>
          </div>
          """

          payload = json.dumps({
              "from": from_addr,
              "to":   [to_addr],
              "subject": subject,
              "html": html,
          }).encode()

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=payload,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "User-Agent": "sandbox-siege-ci/1.0",
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Resend: {resp.status} — email queued")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Resend error {e.code}: {body}")
              # Non-zero exit so the step is visible as failed in the UI,
              # but we don't want it to block the gate enforcement step.
              sys.exit(0)
          EOF

      # ── 9. Stack teardown ────────────────────────────────────────────────────
      - name: Teardown stack
        if: always()
        run: docker compose down -v

      # ── 10. Enforce gate exit code ────────────────────────────────────────────
      - name: Enforce gate
        if: always()
        run: |
          if [ "${SIEGE_EXIT:-0}" = "1" ]; then
            echo "Gate FAILED — trust score below threshold."
            exit 1
          fi
