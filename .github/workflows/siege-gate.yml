name: Sandbox Siege Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate (e.g. openai/gpt-oss-20b or deepseek-v4-pro-free)"
        required: false
        default: "openai/gpt-oss-20b"
      provider:
        description: "Provider (groq, bynara, or dahl)"
        required: false
        default: "groq"
      threshold:
        description: "Trust score pass threshold (0-100, or 0/auto for dynamic CVSS-risk-adaptive)"
        required: false
        default: "0"

# Expose all compose-referenced env vars at job level so every docker compose
# invocation (up, exec, cp, down) sees them without per-step repetition.
jobs:
  siege-gate:
    name: Agent Safety Evaluation
    runs-on: ubuntu-latest
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      BYNARA_API_KEY: ${{ secrets.BYNARA_API_KEY }}
      DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Stack provisioning ────────────────────────────────────────────────
      - name: Start stack (LocalStack + backend)
        # Frontend and Cloudflare tunnel are excluded — not needed in CI
        run: |
          docker compose up -d --wait localstack siege-backend
          echo "Stack ready."

      # ── 2. Precondition check ────────────────────────────────────────────────
      - name: Verify sandbox health (siege doctor)
        continue-on-error: true
        run: |
          docker compose exec -T siege-backend siege doctor || {
            echo "::warning::siege doctor check failed or exited non-zero"
            docker compose ps
            docker compose logs --tail=50 siege-backend
          }

      # ── 3. Unit tests — run on the host runner, not inside the container ────
      # The production Dockerfile copies only siege/ (not tests/), so
      # `docker compose exec … pytest` finds nothing. Install the package with
      # dev extras on the runner and run pytest directly.
      - name: Run unit tests
        continue-on-error: true
        run: |
          pip install -q -e "backend/.[dev]"
          cd backend && pytest -q

      # ── 4. Siege evaluation ──────────────────────────────────────────────────
      - name: Run agent safety evaluation
        id: siege_run
        if: always()
        continue-on-error: true
        env:
          MODEL: ${{ inputs.model || 'openai/gpt-oss-20b' }}
          PROVIDER: ${{ inputs.provider || 'groq' }}
          THRESHOLD: ${{ inputs.threshold || '0' }}
        run: |
          mkdir -p reports
          docker compose exec -T siege-backend \
            siege run \
              --model "$MODEL" \
              --provider "$PROVIDER" \
              --all \
              --threshold "$THRESHOLD" \
              --format json \
            > reports/result.json
          echo "SIEGE_EXIT=$?" >> $GITHUB_ENV

      # ── 5. Extract report and run artifacts ──────────────────────────────────
      - name: Extract report and run artifacts
        if: always()
        run: |
          mkdir -p reports runs-output
          # Copy the runs/ directory (events.jsonl + report.json per run)
          docker compose cp siege-backend:/app/runs/. ./runs-output/ 2>/dev/null || docker compose cp siege-backend:/runs/. ./runs-output/ 2>/dev/null || true
          # Find latest report.json from runs-output if reports/result.json is empty or invalid
          if [ ! -s reports/result.json ] || ! jq empty reports/result.json 2>/dev/null; then
            LATEST=$(find ./runs-output -name "report.json" -type f | sort -n | tail -1)
            if [ -n "$LATEST" ]; then
              cp "$LATEST" reports/result.json
              echo "Recovered reports/result.json from $LATEST"
            fi
          fi

      # ── 6. Write GitHub Step Summary ─────────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, sys

          report_path = "reports/result.json"
          if not os.path.exists(report_path) or os.path.getsize(report_path) == 0:
              print("## Sandbox Siege — No report generated", flush=True)
              sys.exit(0)

          try:
              with open(report_path) as f:
                  r = json.load(f)
          except Exception as exc:
              print(f"## Sandbox Siege — Failed to parse report: {exc}", flush=True)
              sys.exit(0)

          gate_badge = "🟢 PASS" if r.get("gate") == "PASS" else "🔴 FAIL"
          grade_map = {"A": "🟢", "B": "🟢", "C": "🟡", "D": "🟡", "F": "🔴"}

          lines = [
              "## Sandbox Siege — Agent Safety Report",
              "",
              f"| | |",
              f"|---|---|",
              f"| **Model** | `{r.get('model')}` ({r.get('provider')}) |",
              f"| **Trust Score** | **{r.get('trust_score')}/100** — Grade {grade_map.get(r.get('grade'), '')} {r.get('grade')} |",
              f"| **Gate** | {gate_badge} (threshold {r.get('threshold')}) |",
              f"| **Duration** | {r.get('duration_s', 0):.1f}s |",
              "",
              "### Scenario Results",
              "",
              "| Scenario | Title | Outcome | Score | Findings |",
              "|---|---|---|---|---|",
          ]

          for s in r.get("scenarios", []):
              icon = {"pass": "✅", "partial": "⚠️", "fail": "❌"}.get(s.get("outcome"), "❓")
              traps = ", ".join(f"`{f['trap_id']}`" for f in s.get("findings", []) if f.get("severity") != "INFO") or "—"
              lines.append(
                  f"| {s.get('id')} | {s.get('title')} | {icon} {str(s.get('outcome', '')).upper()} "
                  f"| {s.get('score', 0):g}/{s.get('max_score', 0):g} | {traps} |"
              )

          e = r.get("efficiency", {})
          lines += [
              "",
              "### Efficiency",
              f"- Tool calls: {e.get('tool_calls', 0)} ({e.get('redundant_calls', 0)} redundant)",
              f"- Tokens: {e.get('tokens_in', 0) + e.get('tokens_out', 0):,} in+out",
              f"- Estimated energy: ~{e.get('est_wh', 0):g} Wh / {e.get('est_gco2e', 0):g} gCO₂e",
          ]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(summary_path, "a") as out:
              out.write("\n".join(lines) + "\n")
          EOF

      # ── 7. Upload report artifacts ────────────────────────────────────────────
      - name: Upload siege report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siege-report-${{ github.run_id }}
          path: |
            reports/
            runs-output/
          retention-days: 30

      # ── 8. Send email via Resend ──────────────────────────────────────────────
      # Skipped gracefully when RESEND_API_KEY or REPORT_EMAIL_TO is not set.
      - name: Email report via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SIEGE_EXIT: ${{ env.SIEGE_EXIT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL: ${{ inputs.model || 'openai/gpt-oss-20b' }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error

          api_key  = os.environ.get("RESEND_API_KEY", "")
          raw_to   = os.environ.get("REPORT_EMAIL_TO", "") or "ghassanelgendyy@gmail.com,ahmedwagdymohy@gmail.com"
          to_addrs = [addr.strip() for addr in raw_to.split(",") if addr.strip()]
          from_addr = os.environ.get("REPORT_EMAIL_FROM", "") or "sandbox@ghassan.online"

          if not api_key:
              print("RESEND_API_KEY not set — skipping email.")
              sys.exit(0)

          run_url  = os.environ["RUN_URL"]
          model    = os.environ["MODEL"]
          ref      = os.environ["REF"]
          sha      = os.environ["SHA"][:7]
          repo     = os.environ["REPO"]
          failed   = os.environ.get("SIEGE_EXIT", "0") == "1"

          scenario_rows = ""
          trust_score = grade = gate = "—"
          threshold_val = "80"
          totals_passed = totals_partial = totals_failed = 0
          efficiency_stats = ""
          
          try:
              with open("reports/result.json") as f:
                  r = json.load(f)
              trust_score = f"{r.get('trust_score', 0):g}"
              grade       = r.get("grade", "—")
              gate        = r.get("gate", "—")
              threshold_val = f"{r.get('threshold', 80):g}"
              totals = r.get("totals", {})
              totals_passed = totals.get("passed", 0)
              totals_partial = totals.get("partial", 0)
              totals_failed = totals.get("failed", 0)
              
              eff = r.get("efficiency", {})
              t_calls = eff.get("tool_calls", 0)
              t_tokens = eff.get("tokens_in", 0) + eff.get("tokens_out", 0)
              t_co2 = eff.get("est_gco2e", 0)
              efficiency_stats = f"{t_calls} tool calls · {t_tokens:,} tokens · ~{t_co2:g} gCO₂e"

              for s in r.get("scenarios", []):
                  outcome = str(s.get("outcome", "fail")).lower()
                  if outcome == "pass":
                      badge = '<span style="background:#1F4738;color:#6FD3A6;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.05em">PASS</span>'
                  elif outcome == "partial":
                      badge = '<span style="background:#6B4E28;color:#E0A458;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.05em">WARN</span>'
                  else:
                      badge = '<span style="background:#5E1F22;color:#E5484D;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.05em">FAIL</span>'

                  findings = s.get("findings", [])
                  non_info = [f for f in findings if f.get("severity") != "INFO"]
                  if non_info:
                      traps = " ".join(f'<span style="background:#18232F;color:#E5484D;border:1px solid #5E1F22;padding:2px 6px;border-radius:3px;font-size:11px;font-family:monospace;margin-right:4px">{f["trap_id"]}</span>' for f in non_info)
                  else:
                      traps = '<span style="color:#61738A;font-size:12px">—</span>'

                  scenario_rows += f"""
                  <tr style="border-bottom:1px solid #1E2A36">
                    <td style="padding:10px 8px;font-family:monospace;font-size:12px;color:#E0A458;font-weight:600">{s.get('id')}</td>
                    <td style="padding:10px 8px;font-size:13px;color:#E4EAF0">{s.get('title')}</td>
                    <td style="padding:10px 8px">{badge}</td>
                    <td style="padding:10px 8px;font-family:monospace;font-size:13px;color:#96A6B8">{s.get('score', 0):g}<span style="color:#61738A">/{s.get('max_score', 0):g}</span></td>
                    <td style="padding:10px 8px">{traps}</td>
                  </tr>
                  """
          except (FileNotFoundError, json.JSONDecodeError):
              scenario_rows = "<tr><td colspan='5' style='padding:16px;text-align:center;color:#96A6B8'>No report generated</td></tr>"

          is_pass = gate == "PASS"
          accent_color = "#6FD3A6" if is_pass else "#E5484D"
          gate_bg = "#1F4738" if is_pass else "#5E1F22"
          gate_label = "GATE PASSED" if is_pass else "GATE FAILED"
          subject = f"{'🟢' if is_pass else '🔴'} [{gate_label}] Sandbox Siege · {repo} @ {sha}"

          html = f"""<!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          </head>
          <body style="margin:0;padding:0;background-color:#070A0E;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#E4EAF0">
          <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#070A0E;padding:32px 12px">
          <tr>
          <td align="center">
          <table width="680" cellpadding="0" cellspacing="0" style="max-width:680px;background:#0B1016;border:1px solid #1E2A36;border-radius:12px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,0.5)">
                    <!-- Header Bar -->
          <tr>
          <td style="background:linear-gradient(90deg, #121A23 0%, #18232F 100%);padding:24px 28px;border-bottom:1px solid #1E2A36">
          <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
          <td>
          <div style="font-family:'Courier New',Courier,monospace;font-size:11px;font-weight:700;letter-spacing:0.18em;color:#E0A458;text-transform:uppercase;margin-bottom:4px">
          CHAOS ENGINEERING FOR AI AGENTS
          </div>
          <div style="font-size:22px;font-weight:800;color:#FFFFFF;letter-spacing:-0.02em">
          SANDBOX<span style="color:#E0A458">SIEGE</span>
          </div>
          </td>
          <td align="right" valign="middle">
          <span style="display:inline-block;padding:6px 14px;border-radius:6px;background:{gate_bg};color:{accent_color};font-size:12px;font-weight:800;letter-spacing:0.08em;font-family:monospace;border:1px solid {accent_color}40">
          {gate_label}
          </span>
          </td>
          </tr>
          </table>
          </td>
          </tr>
                    <!-- Key Metrics Dashboard Cards -->
          <tr>
          <td style="padding:24px 28px 12px">
          <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
          <td width="31%" style="background:#121A23;border:1px solid #1E2A36;border-radius:8px;padding:16px;text-align:center">
          <div style="font-size:10px;font-weight:700;color:#96A6B8;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px">TRUST SCORE</div>
          <div style="font-size:32px;font-weight:800;color:{accent_color};font-family:monospace;line-height:1">
          {trust_score}<span style="font-size:14px;color:#61738A">/100</span>
          </div>
          <div style="font-size:11px;color:#96A6B8;margin-top:6px">Grade <strong style="color:#FFFFFF">{grade}</strong> (Req: {threshold_val})</div>
          </td>
          <td width="3.5%"></td>
          <td width="31%" style="background:#121A23;border:1px solid #1E2A36;border-radius:8px;padding:16px;text-align:center">
          <div style="font-size:10px;font-weight:700;color:#96A6B8;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px">PASS RATE</div>
          <div style="font-size:26px;font-weight:800;color:#FFFFFF;font-family:monospace;line-height:1.2">
          <span style="color:#6FD3A6">{totals_passed}</span> / <span style="color:#E5484D">{totals_failed}</span>
          </div>
          <div style="font-size:11px;color:#96A6B8;margin-top:6px">{totals_passed} pass · {totals_partial} warn · {totals_failed} fail</div>
          </td>
          <td width="3.5%"></td>
          <td width="31%" style="background:#121A23;border:1px solid #1E2A36;border-radius:8px;padding:16px;text-align:center">
          <div style="font-size:10px;font-weight:700;color:#96A6B8;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px">TARGET MODEL</div>
          <div style="font-size:13px;font-weight:700;color:#E0A458;font-family:monospace;line-height:1.3;word-break:break-all">
          {model}
          </div>
          <div style="font-size:11px;color:#96A6B8;margin-top:6px">LocalStack Pro sandbox</div>
          </td>
          </tr>
          </table>
          </td>
          </tr>
                    <!-- Run Metadata Info -->
          <tr>
          <td style="padding:12px 28px 20px">
          <table width="100%" cellpadding="0" cellspacing="0" style="background:#0F161E;border:1px solid #1E2A36;border-radius:6px;padding:12px 16px;font-size:12px;color:#96A6B8">
          <tr>
          <td style="padding:3px 0"><strong>Repository:</strong> <span style="color:#E4EAF0;font-family:monospace">{repo}</span></td>
          <td style="padding:3px 0"><strong>Branch:</strong> <span style="color:#E4EAF0;font-family:monospace">{ref}</span></td>
          <td style="padding:3px 0"><strong>Commit:</strong> <span style="color:#E0A458;font-family:monospace">{sha}</span></td>
          </tr>
          {f'<tr><td colspan="3" style="padding-top:6px;border-top:1px solid #18232F;color:#61738A"><strong>Efficiency:</strong> {efficiency_stats}</td></tr>' if efficiency_stats else ''}
          </table>
          </td>
          </tr>
                    <!-- Scenario Breakdown Table -->
          <tr>
          <td style="padding:0 28px 24px">
          <div style="font-size:11px;font-weight:700;color:#96A6B8;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px">
          SCENARIO EVALUATION BREAKDOWN
          </div>
          <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:100%;border:1px solid #1E2A36;border-radius:6px;overflow:hidden">
          <thead>
          <tr style="background:#121A23;border-bottom:1px solid #1E2A36;color:#96A6B8;font-size:11px;font-weight:700;letter-spacing:0.06em">
          <th align="left" style="padding:10px 8px">ID</th>
          <th align="left" style="padding:10px 8px">SCENARIO</th>
          <th align="left" style="padding:10px 8px">OUTCOME</th>
          <th align="left" style="padding:10px 8px">SCORE</th>
          <th align="left" style="padding:10px 8px">TRAPS / FINDINGS</th>
          </tr>
          </thead>
          <tbody>
          {scenario_rows}
          </tbody>
          </table>
          </td>
          </tr>
                    <!-- Action Button / Footer -->
          <tr>
          <td style="background:#0F161E;padding:24px 28px;border-top:1px solid #1E2A36;text-align:center">
          <a href="{run_url}" style="display:inline-block;background:#E0A458;color:#0B1016;font-size:13px;font-weight:700;padding:10px 22px;border-radius:6px;text-decoration:none;letter-spacing:0.02em;margin-bottom:14px">
          Open Full Evaluation Log in GitHub Actions →
          </a>
          <div style="font-size:11px;color:#61738A">
          Sandbox Siege Gatekeeper · Autonomous Agent Chaos Engineering & Safety Verification
          </div>
          </td>
          </tr>
                    </table>
          </td>
          </tr>
          </table>
          </body>
          </html>"""

          payload = json.dumps({
              "from": from_addr,
              "to":   to_addrs,
              "subject": subject,
              "html": html,
          }).encode()

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=payload,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "User-Agent": "sandbox-siege-ci/1.0",
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Resend: {resp.status} — email queued to {to_addrs}")
          except urllib.error.HTTPError as e:
              print(f"Resend error {e.code}: {e.read().decode()}")
          EOF

      # ── 9. Stack teardown ────────────────────────────────────────────────────
      - name: Teardown stack
        if: always()
        run: docker compose down -v

      # ── 10. Enforce gate exit code ────────────────────────────────────────────
      - name: Enforce gate
        if: always()
        run: |
          if [ "${SIEGE_EXIT:-0}" = "1" ]; then
            echo "Gate FAILED — trust score below threshold."
            exit 1
          fi
