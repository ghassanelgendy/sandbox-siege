[project]
name = "sandbox-siege"
version = "0.1.0"
description = "Chaos engineering for AI agents — an adversarial safety harness for autonomous DevOps agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "boto3>=1.35",
    "openai>=1.55",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
siege = "siege.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["siege*"]

[tool.setuptools.package-data]
siege = ["scenarios/*.yaml", "scenarios/*/*.yaml", "*.json", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
