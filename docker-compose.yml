# Sandbox Siege — Full Containerized Stack with Cloudflare Tunnel & Custom Ports
services:
  localstack:
    container_name: siege-localstack
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - ENFORCE_IAM=1
      - SERVICES=s3,dynamodb,sqs,sns,rds,ec2,logs,secretsmanager,ssm,iam,sts
      - PERSISTENCE=0
      - DEBUG=${DEBUG:-0}
      - EXTRA_CORS_ALLOWED_ORIGINS=*
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./.localstack-data:/var/lib/localstack"
      - "./localstack/init-scripts:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  siege-backend:
    container_name: siege-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18000:18000"
    environment:
      - LOCALSTACK_HOST=localstack
      - AWS_ENDPOINT_URL=http://localstack:4566
      - BYNARA_API_KEY=${BYNARA_API_KEY}
      - DAHL_API_KEY=${DAHL_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      localstack:
        condition: service_healthy

  siege-frontend:
    container_name: siege-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "25173:80"
    depends_on:
      - siege-backend

  cloudflared:
    container_name: siege-cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run ${CLOUDFLARE_TUNNEL_ID:-1589645d-cd7b-43da-83b3-a2934faabdc8}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_ID=${CLOUDFLARE_TUNNEL_ID:-1589645d-cd7b-43da-83b3-a2934faabdc8}
    depends_on:
      - siege-frontend
