# Sandbox Siege — Full Containerized Stack with Cloudflare Tunnel & Custom Ports
services:
  localstack:
    container_name: siege-localstack
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - ENFORCE_IAM=1
      - SERVICES=s3,dynamodb,sqs,sns,rds,ec2,logs,secretsmanager,ssm,iam,sts
      - PERSISTENCE=0
      - DEBUG=${DEBUG:-0}
      - EXTRA_CORS_ALLOWED_ORIGINS=*
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./.localstack-data:/var/lib/localstack"
      - "./localstack/init-scripts:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - siege-core

  siege-backend:
    container_name: siege-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18000:18000"
    environment:
      - LOCALSTACK_HOST=localstack
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SIEGE_DEMO_RESULT_TTL_S=${SIEGE_DEMO_RESULT_TTL_S:-600}
      - BYNARA_API_KEY=${BYNARA_API_KEY}
      - DAHL_API_KEY=${DAHL_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SIEGE_SEARXNG_URL=http://searxng:8080
      # Resend report email (D-32 CI dispatch; D-52 on-demand /demo dispatch)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - REPORT_EMAIL_FROM=${REPORT_EMAIL_FROM:-sandbox@ghassan.online}
      # Jev advisory judge (PRD §8.2, FR-4.9, D-43/D-44) — optional. Leave
      # JEV_API_KEY unset in .env to disable; jev.py falls back to None cleanly.
      - JEV_BASE_URL=http://jev-sidecar:8090
      - JEV_API_KEY=${JEV_API_KEY:-}
    volumes:
      - "./runs:/app/runs"
      - "./backend/siege:/app/siege"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - siege-core
      - siege-egress
    depends_on:
      localstack:
        condition: service_healthy
      searxng:
        condition: service_healthy
      jev-sidecar:
        condition: service_healthy

  siege-frontend:
    container_name: siege-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "25173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - siege-core
    depends_on:
      siege-backend:
        condition: service_healthy

  cloudflared:
    container_name: siege-cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_ID=${CLOUDFLARE_TUNNEL_ID:-1589645d-cd7b-43da-83b3-a2934faabdc8}
    networks:
      - siege-core
    depends_on:
      siege-frontend:
        condition: service_healthy

  # Jev advisory judge sidecar (PRD §8.2, FR-4.9, D-43/D-44) -- optional.
  # Adapts jev.py's REST contract (POST /v1/judge) onto Vercel AI Gateway's
  # Node-only `experimental_evaluate` SDK call for the `typesafe-ai/jev`
  # model, since no direct REST endpoint for Jev is documented or verified.
  # Deliberately NOT on siege-core, same isolation rationale as searxng below:
  # it only needs egress to reach the Gateway, never LocalStack.
  jev-sidecar:
    container_name: siege-jev-sidecar
    build:
      context: ./jev-sidecar
      dockerfile: Dockerfile
    environment:
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY:-}
      - JEV_API_KEY=${JEV_API_KEY:-}
      - PORT=8090
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - siege-egress

  # Web-search backend for the agent's `web_search` tool (PRD FR-3.5).
  # Deliberately NOT on siege-core: it must never be able to reach LocalStack.
  # The agent never addresses this service -- only the Siege backend does,
  # server-side, and only after the Gateway has cleared the query.
  searxng:
    container_name: siege-searxng
    image: searxng/searxng:latest
    ports:
      - "18080:8080"
    volumes:
      - "./searxng/settings.yml:/etc/searxng/settings.yml:ro"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    restart: unless-stopped
    networks:
      - siege-egress
    healthcheck:
      # The SearXNG image ships wget, not curl.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  # LocalStack, backend, frontend, tunnel.
  siege-core:
    driver: bridge
  # Backend <-> SearXNG only. SearXNG needs the public internet for upstream
  # engines, so this cannot be `internal: true`; isolation from the sandbox is
  # achieved by keeping LocalStack off this network entirely.
  siege-egress:
    driver: bridge
