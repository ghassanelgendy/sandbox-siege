server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page App routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy and Server-Sent Events (SSE) streaming support
    location /api/ {
        proxy_pass http://siege-backend:18000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time SSE event streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Standalone presentation assets served by the backend, exposed on the
    # same public host as the SPA (and therefore the Cloudflare tunnel).
    location ~ ^/(deck|presentation|architecture|sequence)(\.html)?$ {
        proxy_pass http://siege-backend:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
